[project]
name = "portia-research"
version = "0.1.0"
description = "Notebook exploration and naive audio baselines for PORTIA"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "remotezip>=0.12.6",
    "ruff>=0.17.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "soundfile>=0.14.0",
    "tqdm>=4.70.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

